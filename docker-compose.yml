version: "3.9"

services:
  backend:
    build: ./backend_express
    ports:
      - "5001:5001"
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      - PORT=5001
      - NODE_ENV=development
      - PYTHON_SERVICE_URL=http://analyzer:8000/analyze
      - MONGO_URI=mongodb://mongo:27017/ai-review
      - MONGO_URL=mongodb://mongo:27017/ai-review
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALLOWED_ORIGINS=http://localhost:5173
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret-change-in-prod-min32}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  analyzer:
    build: ./analyzer_python
    expose:
      - "8000"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://localhost:5001
      - VITE_API_URL=http://localhost:5001

volumes:
  mongo-data:
  redis-data:
